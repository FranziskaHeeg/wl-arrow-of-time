[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "egnn"
version = "1.0.0"
description = "Message passing on augmented temporal event graphs (Weisfeiler and Leman Follow the Arrow of Time, NeurIPS 2026)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1",
    "torch_geometric==2.5.1",
    "pathpyG==0.2.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
]

[tool.setuptools]
packages = ["egnn"]
